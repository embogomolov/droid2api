# 🐳 droid2api - Docker Compose configuration
# Version: v1.4.0+
# Documentation: DOCKER_DEPLOY.md

version: '3.8'

services:
  droid2api:
    build: .
    container_name: droid2api
    ports:
      - "3000:3000"
    environment:
      # ===== 🔐 Five-level authentication (choose by priority; configure at least one method) =====

      # 1️⃣ Highest priority: fixed API key (recommended for production; single-key mode)
      - FACTORY_API_KEY=${FACTORY_API_KEY}

      # 2️⃣ Add keys to the pool through the web interface; no environment variable required

      # 3️⃣ Third priority: automatic OAuth refresh (every 6 hours)
      - DROID_REFRESH_KEY=${DROID_REFRESH_KEY}

      # ===== 🔑 Admin access (strongly recommended) =====
      - ADMIN_ACCESS_KEY=${ADMIN_ACCESS_KEY:-your-admin-password-change-me}

      # ===== 🛡️ Client access control (optional) =====
      - API_ACCESS_KEY=${API_ACCESS_KEY}

      # ===== 🚀 Server settings (optional) =====
      - PORT=${PORT:-3000}
      - NODE_ENV=${NODE_ENV:-production}

      # ===== 🎯 Key pool settings (optional) =====
      - KEY_POOL_ALGORITHM=${KEY_POOL_ALGORITHM:-round-robin}
      - KEY_POOL_RETRY_ENABLED=${KEY_POOL_RETRY_ENABLED:-true}
      - KEY_POOL_RETRY_MAX=${KEY_POOL_RETRY_MAX:-3}
      - KEY_POOL_AUTO_BAN_ENABLED=${KEY_POOL_AUTO_BAN_ENABLED:-true}
      - KEY_POOL_BAN_402=${KEY_POOL_BAN_402:-true}

      # ===== 🔥 Redis caching (optional, for performance) =====
      # Enabling Redis can improve performance by 30-50%
      # - REDIS_HOST=redis
      # - REDIS_PORT=6379
      # - REDIS_PASSWORD=
      # - REDIS_DB=0

      # ===== ⚡ Cluster mode (optional, for maximum performance) =====
      # Cluster mode can deliver N times the performance (N = CPU core count)
      # - CLUSTER_MODE=true
      # - CLUSTER_WORKERS=4

    volumes:
      # 💾 Persistent data directory (recommended: keeps key pool data across container restarts)
      - ./data:/app/data
      # 📝 Persistent log directory (optional)
      - ./logs:/app/logs

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # depends_on:
    #   - redis  # Uncomment when enabling Redis

  # ===== 🔥 Redis caching service (optional) =====
  # Use case: more than 500,000 requests/day on average
  # To enable, uncomment the following configuration and set REDIS_HOST=redis for droid2api

  # redis:
  #   image: redis:alpine
  #   container_name: droid2api-redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis-data:/data
  #   command: redis-server --appendonly yes
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 3s
  #     retries: 3

# ===== 📦 Volume definitions (optional) =====
# Uncomment to use named volumes instead of bind mounts

# volumes:
#   redis-data:

# ===== 📖 Usage =====
#
# Quick start in three steps:
#   1. cp .env.example .env
#   2. Edit .env, configuring at least one authentication method and ADMIN_ACCESS_KEY
#   3. docker-compose up -d
#
# Common commands:
#   Start: docker-compose up -d
#   View logs: docker-compose logs -f
#   Stop: docker-compose down
#   Restart: docker-compose restart
#   Status: docker-compose ps
#
# Access the service:
#   API: http://localhost:3000
#   Admin interface: http://localhost:3000/ (requires ADMIN_ACCESS_KEY)
#   Health check: http://localhost:3000/v1/models
#
# Performance optimization:
#   - Stage 1 (default): 2000+ RPS, no configuration required
#   - Stage 2 (Redis): 3000+ RPS, uncomment the redis service configuration
#   - Stage 3 (cluster): 10000+ RPS, enable CLUSTER_MODE=true
#
# Detailed documentation:
#   - DOCKER_DEPLOY.md - Docker deployment guide
#   - README.md - Project documentation
#   - docs/MULTI_TIER_POOL.md - Multi-tier key pools
